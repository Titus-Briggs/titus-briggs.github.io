baseURL = 'https://titus-briggs.github.io/'
languageCode = 'en-uk'
title = 'Titus Briggs'
theme = 'FixIt'

# ===== Direct html image sizing =====
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ===== Click on images to zoom in =====
[params.page]
lightbox = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# ===== About page =====
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 1
    pre = "<i class='fa-solid fa-circle-question'></i> "


# ===== Categories and tags =====
 [[menu.main]]
